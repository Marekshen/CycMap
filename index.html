<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#16a34a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CycMap</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></symbol>
    <symbol id="i-export" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  </defs>
</svg>

<nav id="toolbar" class="glass">
  <button id="btnLocate" title="現在位置" aria-label="現在位置"><svg><use href="#i-locate"/></svg></button>
  <button id="btnLayers" data-pop="popLayers" title="圖層" aria-label="圖層"><svg><use href="#i-layers"/></svg></button>
  <button id="btnSearch" data-pop="popSearch" title="搜尋" aria-label="搜尋"><svg><use href="#i-search"/></svg></button>
  <button id="btnClear" title="清除" aria-label="清除"><svg><use href="#i-trash"/></svg></button>
  <button id="btnReverse" title="頭尾互換" aria-label="頭尾互換"><svg><use href="#i-swap"/></svg></button>
  <button id="btnExport" title="匯出" aria-label="匯出"><svg><use href="#i-export"/></svg></button>
  <button id="btnFavs" data-pop="popFavs" title="喜愛點" aria-label="喜愛點"><svg><use href="#i-star"/></svg></button>
  <button id="btnSettings" title="設定" aria-label="設定"><svg><use href="#i-settings"/></svg></button>
</nav>

<div id="popLayers" class="pop glass" hidden>
  <div id="layers">
    <button data-layer="map">地圖</button>
    <button data-layer="sat">衛星</button>
    <button data-layer="cycle">單車</button>
  </div>
</div>

<div id="popSearch" class="pop glass" hidden>
  <form id="search" autocomplete="off">
    <input id="q" type="search" placeholder="搜尋景點、地址…" enterkeyhint="search">
    <button type="submit" class="icon" aria-label="搜尋"><svg><use href="#i-search"/></svg></button>
    <button type="button" id="searchClose" class="icon" aria-label="關閉"><svg><use href="#i-x"/></svg></button>
  </form>
  <ul id="results" hidden></ul>
</div>

<div id="popFavs" class="pop glass" hidden>
  <ul id="favList"></ul>
  <p class="hint">長按地圖（電腦用右鍵）可新增喜愛點；點地圖上的星號可加入路線。</p>
</div>

<dialog id="favDialog">
  <form method="dialog">
    <h3 id="favTitle">新增喜愛點</h3>
    <input id="favName" type="text" maxlength="40" placeholder="名稱" class="wide">
    <div class="actions">
      <button value="cancel">取消</button>
      <button value="save" class="primary">儲存</button>
    </div>
  </form>
</dialog>


<div id="card" class="glass hidden">
  <canvas id="mini" width="120" height="120"></canvas>
  <div class="stats">
    <div class="row"><span class="label">距離</span><span id="dist" class="val">--</span></div>
    <div class="row"><span class="label">預估時間</span><span id="time" class="val">--</span></div>
    <div class="row sub"><span class="label">爬升</span><span id="climb">--</span></div>
    <div class="row sub"><span class="label">均速</span><span id="avg">--</span></div>
    <div id="status"></div>
  </div>
</div>

<dialog id="settings">
  <form method="dialog">
    <h3>設定</h3>
    <label>平地均速 (0%)<span><input id="sFlat" type="number" min="1" max="80" step="0.5"> km/h</span></label>
    <label>陡坡速度 (10% 以上)<span><input id="sSteep" type="number" min="1" max="80" step="0.5"> km/h</span></label>
    <p class="hint">0% 到 10% 之間以等差計算，下坡以平地速度計。</p>
    <label>路線偏好
      <select id="sProfile">
        <option value="safety">單車道優先</option>
        <option value="trekking">平衡</option>
        <option value="fastbike">最快（公路車）</option>
      </select>
    </label>
    <div class="actions">
      <button value="cancel">取消</button>
      <button id="sSave" value="save" class="primary">儲存</button>
    </div>
  </form>
</dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
